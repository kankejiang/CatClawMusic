<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9EBE"/>
      <stop offset="1" stop-color="#F56FA0"/>
    </linearGradient>
  </defs>

  <!-- 夜猫纯深底 -->
  <rect width="512" height="512" rx="118" fill="#1E1826"/>

  <!-- 居中渐变小卡片 -->
  <rect x="136" y="136" width="240" height="240" rx="62" fill="url(#card)"/>

  <!-- 卡片内右上角一枚小白音符 -->
  <g fill="#FFFFFF" opacity="0.95" transform="translate(336 172) rotate(8)">
    <circle r="8"/>
    <rect x="4" y="-28" width="6" height="30" rx="3"/>
    <path d="M4 -28 q14 3 15 13 q-8 -7 -15 -5 Z"/>
  </g>

  <!-- 双爪击掌(左右镜像) -->
  <!-- 左爪 -->
  <g transform="translate(198 316) rotate(-14)">
    <rect x="-48" y="-150" width="96" height="158" rx="46" fill="#FFFFFF"/>
    <circle cx="-30" cy="-140" r="23" fill="#FFFFFF"/>
    <circle cx="0" cy="-150" r="24" fill="#FFFFFF"/>
    <circle cx="30" cy="-140" r="23" fill="#FFFFFF"/>
    <circle cx="-30" cy="-136" r="10" fill="#FFB6D1"/>
    <circle cx="0" cy="-146" r="11" fill="#FFB6D1"/>
    <circle cx="30" cy="-136" r="10" fill="#FFB6D1"/>
    <!-- 掌心大肉垫 -->
    <ellipse cx="0" cy="-38" rx="30" ry="24" fill="#FFB6D1"/>
  </g>
  <!-- 右爪(镜像) -->
  <g transform="translate(314 316) rotate(14)">
    <rect x="-48" y="-150" width="96" height="158" rx="46" fill="#FFFFFF"/>
    <circle cx="-30" cy="-140" r="23" fill="#FFFFFF"/>
    <circle cx="0" cy="-150" r="24" fill="#FFFFFF"/>
    <circle cx="30" cy="-140" r="23" fill="#FFFFFF"/>
    <circle cx="-30" cy="-136" r="10" fill="#FFB6D1"/>
    <circle cx="0" cy="-146" r="11" fill="#FFB6D1"/>
    <circle cx="30" cy="-136" r="10" fill="#FFB6D1"/>
    <ellipse cx="0" cy="-38" rx="30" ry="24" fill="#FFB6D1"/>
  </g>

  <!-- 顶部三条击掌动效线 -->
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.95">
    <path d="M256 112 v34"/>
    <path d="M198 124 l-14 30"/>
    <path d="M314 124 l14 30"/>
  </g>
</svg>
